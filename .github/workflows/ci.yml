name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [booking-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Testcontainers compatible with newer Docker
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Run tests
        run: mvn -B test
        working-directory: ${{ matrix.service }}